[package]
name = "ritual-db"
version = "0.1.0"
edition = "2021"
description = "Unified libSQL database layer for Ritual with vector search support"
authors = ["Ritual"]
license = "MIT"

[features]
default = ["legacy-sqlite-migration"]
legacy-sqlite-migration = ["dep:rusqlite"]

[dependencies]
# LibSQL - SQLite fork with vector search and Turso cloud sync
# v0.9+ required for the "sync" feature (embedded replicas)
libsql = { version = "0.9", features = ["sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Path expansion (~/.ritual -> /Users/x/.ritual)
shellexpand = "3.1"

# Async runtime
tokio = { version = "1.35", features = ["sync", "fs", "time"] }

# For reading legacy SQLite databases during migration
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# Async trait support
async-trait = "0.1"

# Unicode normalization for text cleaning
unicode-normalization = "0.1"

# Regex for NER extraction
regex = "1.10"

# Lazy static for compiled regexes
once_cell = "1.19"

# Stable logical IDs for cloud sync entities
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
tempfile = "3.10"
