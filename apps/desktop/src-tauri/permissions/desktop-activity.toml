[[permission]]
identifier = "desktop-activity"
description = "Allows the hosted dashboard to query local desktop activity data and watcher status for offline/recent metrics fallback."
commands.allow = [
  "get_detailed_activity",
  "get_daily_summaries",
  "init_ritual_database",
  "check_accessibility_permission",
  "request_accessibility_permission",
  "open_accessibility_settings",
  "open_full_disk_access_settings",
  "open_microphone_settings",
  "open_speech_recognition_settings",
  "open_screen_recording_settings",
  "open_location_settings",
  "show_native_microphone_permission_dialog",
  "check_native_microphone_permission",
  "show_native_speech_recognition_permission_dialog",
  "check_native_speech_recognition_permission",
  "start_watcher",
  "save_watcher_config_cmd",
  "clear_watcher_config_cmd",
  "reconcile_watcher_config_user_cmd",
  "stop_watcher",
  "get_watcher_status",
  "get_browser_extension_diagnostics",
  "get_app_icon",
  "get_app_icons_batch",
  "get_project_time_attribution_health",
]
