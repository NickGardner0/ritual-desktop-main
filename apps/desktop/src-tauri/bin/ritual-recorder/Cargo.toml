[package]
name = "ritual-recorder"
version = "0.1.0"
edition = "2021"
description = "Ritual Recorder - Screen recording with OCR for Ritual"
authors = ["Ritual"]

[[bin]]
name = "ritual-recorder"
path = "src/main.rs"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full", "process", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

# Async utilities
futures = "0.3"
crossbeam = "0.8"

# Unified local activity database
ritual-db = { path = "../../crates/ritual-db" }

# Image processing
image = { version = "0.24", features = ["png", "jpeg"] }
base64 = "0.21"

# Perceptual hashing for frame deduplication
# Note: img_hash uses image 0.23, which conflicts with our image 0.24
# We'll implement our own simple hash instead
sha2 = "0.10"
hex = "0.4"

# Lazy statics
once_cell = "1.19"

# Screen capture
xcap = "0.8"

# CLI and logging
clap = { version = "4.4", features = ["derive"] }
sentry = "0.36"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signal handling
ctrlc = "3.4"

# Path expansion
shellexpand = "3.1"

# Unique identifiers
uuid = { version = "1.6", features = ["v4"] }

# FFmpeg auto-download
ffmpeg-sidecar = "2.0"
which = "6.0"
dirs = "5.0"

# macOS specific - Native Vision framework for OCR
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSData", "NSDictionary", "NSArray", "NSString", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.2", features = ["NSImage", "NSBitmapImageRep"] }
core-foundation = "0.9"
core-foundation-sys = "0.8"
core-graphics = "0.23"
# Note: Vision framework bindings created manually via objc2 FFI
