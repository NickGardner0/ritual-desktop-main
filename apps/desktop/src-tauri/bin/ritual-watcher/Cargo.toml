[package]
name = "ritual-watcher"
version = "0.1.0"
edition = "2021"
description = "Ritual Watcher - macOS computer activity tracker"
authors = ["Ritual"]

[[bin]]
name = "ritual-watcher"
path = "src/main.rs"

[[bin]]
name = "ritual-ax-dump"
path = "src/ax_dump.rs"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

# Async runtime for JXA execution
# (serde_json already included above for JSON parsing)

# Unified database with vector search
ritual-db = { path = "../../crates/ritual-db", default-features = false }

# macOS specific
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", features = ["exception"] }
objc2-foundation = { version = "0.2", features = ["NSProcessInfo", "NSString", "NSRunLoop", "NSArray", "NSURL", "NSData", "NSNotification", "NSThread", "NSDictionary", "NSAppleEventDescriptor"] }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSImage", "NSBitmapImageRep", "NSGraphicsContext"] }
core-foundation = "0.9"
core-foundation-sys = "0.8"
core-graphics = "0.23"
dispatch = "0.2"

# Image processing
image = "0.24"
base64 = "0.21"

# Hashing
sha2 = "0.10"
hex = "0.4"

# CLI and logging
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server for browser extension heartbeats
tiny_http = "0.12"

# Signal handling
ctrlc = "3.4"

# Path expansion
shellexpand = "3.1"
