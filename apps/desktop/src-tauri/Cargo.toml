[workspace]
members = [
    ".",
    "crates/ritual-db",
    "bin/ritual-watcher",
    "bin/ritual-recorder",
]

[package]
name = "app"
version = "0.1.41"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.64"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.5", features = [] }

[dependencies]
# Core Tauri dependencies
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19"
chrono = "0.4"
dirs = "5.0"
base64 = "0.21"
tiny_http = "0.12"
rand = "0.8"
log = "0.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"

# Legacy database (still used by recorder.rs - watcher.rs has been migrated to ritual-db)
rusqlite = { version = "0.31", features = ["bundled"] }

# Unified database layer. Local semantic embeddings are opt-in now; default builds
# keep the Turso-backed activity DB path without linking the local embedding model.
ritual-db = { path = "crates/ritual-db", default-features = false, features = ["legacy-sqlite-migration"] }
libsql = "0.9"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }

# Async runtime for database operations
tokio = { version = "1.35", features = ["rt", "sync"] }

tauri = { version = "1.8.1", features = [
  "fs-read-file",
  "path-all",
  "clipboard-all",
  "fs-write-file",
  "macos-private-api",
  "process-relaunch",
  "protocol-all",
  "system-tray",
  "dialog-all",
  "shell-open",
  "updater",
  "window-create",
  "window-center",
  "window-request-user-attention",
  "window-set-resizable",
  "window-set-title",
  "window-maximize",
  "window-unmaximize",
  "window-minimize",
  "window-unminimize",
  "window-show",
  "window-hide",
  "window-close",
  "window-set-decorations",
  "window-set-always-on-top",
  "window-set-size",
  "window-set-min-size",
  "window-set-max-size",
  "window-set-position",
  "window-set-fullscreen",
  "window-set-focus",
  "window-set-icon",
  "window-set-skip-taskbar",
  "window-set-cursor-grab",
  "window-set-cursor-visible",
  "window-set-cursor-icon",
  "window-set-cursor-position",
  "window-set-ignore-cursor-events",
  "window-start-dragging",
  "window-print"
] }

# Native context menu plugin
tauri-plugin-context-menu = "0.8"

# macOS specific for watcher + vibrancy
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
window-vibrancy = "0.4"
cocoa = "0.25"
objc = "0.2"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-deep-link = "0.1.2"

# ============================================================================
# REMOVED OAuth dependencies - Clerk handles all authentication via web UI
# Removed: warp, reqwest, tokio, uuid, url, base64, sha2, rand, dotenv, open
# This reduces compile time and binary size significantly
# ============================================================================

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
native-recorder = []

[profile.release]
opt-level = 3
lto = "thin"
strip = true
