[workspace]
members = [
    ".",
    "crates/ritual-db",
    "bin/ritual-watcher",
]

[package]
name = "app"
version = "0.1.93"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Core Tauri dependencies
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19"
chrono = "0.4"
dirs = "5.0"
base64 = "0.21"
aes-gcm = "0.10"
tiny_http = "0.12"
rand = "0.8"
log = "0.4"
sentry = "0.36"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"

# Legacy database helpers used by desktop migration/bootstrap code.
rusqlite = { version = "0.31", features = ["bundled"] }

# Unified database layer for local activity capture and project-time attribution.
ritual-db = { path = "crates/ritual-db", default-features = false, features = ["legacy-sqlite-migration"] }
libsql = "0.9"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }

# Async runtime for database operations
tokio = { version = "1.35", features = ["rt", "sync"] }

tauri = { version = "2.10.3", features = [
  "config-json5",
  "macos-private-api",
  "protocol-asset",
  "tray-icon",
  "image-png"
] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2.3.2"

# macOS specific for watcher + vibrancy
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
window-vibrancy = "0.7.1"
cocoa = "0.25"
objc = "0.2"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-deep-link = "2.4.7"

# ============================================================================
# REMOVED OAuth dependencies - Clerk handles all authentication via web UI
# Removed: warp, reqwest, tokio, uuid, url, base64, sha2, rand, dotenv, open
# This reduces compile time and binary size significantly
# ============================================================================

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
