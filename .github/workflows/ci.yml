name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Using npm install (not npm ci) during migration while lockfile/workspaces
      # are being normalized in-repo.
      # --legacy-peer-deps: react-day-picker@8 expects React 18; project uses React 19
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Check repository structure
        run: npm run repo:check

      - name: Typecheck shared contracts
        run: npm run contracts:typecheck

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Lint dashboard
        run: npm run lint

      - name: Python backend compile check
        run: python -m compileall -q apps/backend

      - name: Python backend project-time tests
        run: PYTHONPATH=apps/backend pytest -q apps/backend/tests/test_project_time_service.py apps/backend/tests/test_turso_user_service.py

      - name: Rust desktop check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
