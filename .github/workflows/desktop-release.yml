name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS desktop release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RITUAL_UPDATER_REPOSITORY: NickGardner0/ritual-desktop-releases
      RITUAL_RELEASE_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require canonical release-branch head
        run: |
          git fetch --no-tags origin codex/release-0.1.1-prep
          RELEASE_SHA="$(git rev-parse origin/codex/release-0.1.1-prep)"
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Desktop tags must point at the exact codex/release-0.1.1-prep head (${RELEASE_SHA})." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            apps/desktop/src-tauri

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verify release tag matches desktop version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DESKTOP_VERSION="$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')); process.stdout.write(String(cfg.version || ''))")"
          if [[ -z "${DESKTOP_VERSION}" ]]; then
            echo "Could not read desktop version from tauri.conf.json" >&2
            exit 1
          fi
          if [[ "${DESKTOP_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match desktop version ${DESKTOP_VERSION}" >&2
            exit 1
          fi

      - name: Decode Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_P12_BASE64}" ]]; then
            echo "Missing required secret APPLE_CERTIFICATE_P12_BASE64" >&2
            exit 1
          fi
          CERT_PATH="${RUNNER_TEMP}/ritual-signing-cert.p12"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert_b64 = os.environ["APPLE_CERTIFICATE_P12_BASE64"]
          cert_path = Path(os.environ["RUNNER_TEMP"]) / "ritual-signing-cert.p12"
          cert_path.write_bytes(base64.b64decode(cert_b64))
          print(f"CERT_PATH={cert_path}")
          PY
          echo "APPLE_CERTIFICATE_PATH=${CERT_PATH}" >> "${GITHUB_ENV}"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [[ -z "${APPLE_API_KEY_P8:-}" && -z "${APPLE_API_KEY_P8_BASE64:-}" ]]; then
            echo "No App Store Connect API key material provided; skipping API key file write."
            exit 0
          fi
          if [[ -z "${APPLE_API_KEY}" ]]; then
            echo "APPLE_API_KEY secret must be set when providing an App Store Connect API key." >&2
            exit 1
          fi
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          if [[ -n "${APPLE_API_KEY_P8_BASE64}" ]]; then
            python3 -c 'import base64, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], f"AuthKey_{os.environ[\"APPLE_API_KEY\"]}.p8").write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"]))'
          else
            printf '%s' "${APPLE_API_KEY_P8}" > "${API_KEY_PATH}"
          fi
          echo "APPLE_API_KEY_PATH=${API_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Import Developer ID certificate into temporary keychain
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD}" ]]; then
            echo "Missing required secret APPLE_CERTIFICATE_PASSWORD" >&2
            exit 1
          fi
          KEYCHAIN_PATH="${RUNNER_TEMP}/ritual-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${APPLE_CERTIFICATE_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${HOME}/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          echo "APPLE_SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Build notarized desktop release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DESKTOP_NATIVE_DSN: ${{ secrets.SENTRY_DESKTOP_NATIVE_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run desktop:release:mac

      - name: Upload local release artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.zip
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/latest-*.json

      - name: Cleanup temporary signing keychain
        if: always()
        run: |
          if [[ -n "${APPLE_SIGNING_KEYCHAIN_PATH:-}" && -f "${APPLE_SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${APPLE_SIGNING_KEYCHAIN_PATH}" || true
          fi

  publish:
    name: Validate and publish Apple Silicon updater
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download Apple Silicon artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-release-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Prepare and validate updater manifest
        run: |
          cp release-assets/latest-darwin-aarch64.json release-assets/latest.json
          node scripts/validate-updater-artifacts.mjs --latest release-assets/latest.json --platform darwin-aarch64

      - name: Publish assets to public desktop releases repo
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_REPO_TOKEN }}
          RITUAL_RELEASE_ARTIFACT_ROOT: release-assets
        run: bash scripts/publish-apple-silicon-desktop-release-assets.sh "${GITHUB_REF_NAME}"
