name: Desktop Release

on:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    name: Build macOS desktop release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Write production updater config
        run: node scripts/write-tauri-production-config.mjs

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Ritual Desktop ${{ github.ref_name }}
          releaseBody: |
            Automated macOS beta build for Ritual Desktop.

            Assets include the signed DMG, updater bundles, signatures, and `latest.json` for in-app updates.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.generated.production.conf.json --bundles dmg,updater
